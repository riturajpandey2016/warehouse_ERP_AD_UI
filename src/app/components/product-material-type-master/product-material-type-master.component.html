<div class="company-master-container">
  <main class="page-content">
    
    <!-- DETAILS SECTION -->
    <div class="card-panel">
      <div class="custom-slim-header">
         <span class="custom-header-title">Item Material Type</span>
      </div>
      <div class="panel-body">
         <div class="material-form-grid">
            
            <!-- Row 1: Type, Code, Description -->
            <div class="form-row-side">
               <div class="form-label-box">
                  <span class="form-label-text">Item Material Type :</span>
               </div>
               <div class="form-input-element">
                  <input 
                    type="text"
                    [value]="formData().itemMaterialType" 
                    (input)="updateForm('itemMaterialType', $any($event.target).value)"
                    placeholder="Item Material Type"
                    class="custom-legacy-input"
                  />
               </div>
            </div>

            <div class="form-row-side">
               <div class="form-label-box">
                  <span class="form-label-text">Item Material Code :</span>
               </div>
               <div class="form-input-element relative-asterisk">
                  <input 
                    type="text"
                    [value]="formData().itemMaterialCode" 
                    (input)="updateForm('itemMaterialCode', $any($event.target).value)"
                    class="custom-legacy-input"
                  />
                  <span class="red-asterisk-right">*</span>
               </div>
            </div>

            <div class="form-row-side">
               <div class="form-label-box">
                  <span class="form-label-text">Description :</span>
               </div>
               <div class="form-input-element">
                  <input 
                    type="text"
                    [value]="formData().description" 
                    (input)="updateForm('description', $any($event.target).value)"
                    placeholder="Description"
                    class="custom-legacy-input"
                  />
               </div>
            </div>

            <!-- Row 2: Mode & Entry Date -->
            <div class="form-row-side">
               <div class="form-label-box">
                  <span class="form-label-text">Mode :</span>
               </div>
               <div class="form-input-element flex-row-radio gap-4">
                  <label class="radio-label">
                     <input 
                       type="radio" 
                       name="mode" 
                       value="Active" 
                       [checked]="formData().mode === 'Active'"
                       (change)="updateForm('mode', 'Active')"
                     />
                     Active
                  </label>
                  <label class="radio-label">
                     <input 
                       type="radio" 
                       name="mode" 
                       value="Inactive" 
                       [checked]="formData().mode === 'Inactive'"
                       (change)="updateForm('mode', 'Inactive')"
                     />
                     Inactive
                  </label>
               </div>
            </div>

            <div class="form-row-side">
               <div class="form-label-box">
                  <span class="form-label-text">Entry Date :</span>
               </div>
               <div class="form-input-element date-input-wrapper">
                  <input 
                    type="text"
                    [value]="formData().entryDate" 
                    (input)="updateForm('entryDate', $any($event.target).value)"
                    class="custom-legacy-input"
                  />
                  <span class="calendar-addon">📅</span>
               </div>
            </div>

         </div>

         <!-- Centered Buttons Row -->
         <div class="form-actions-centered">
            <button class="btn-legacy-save font-bold">Save</button>
            <button (click)="handleReset()" class="btn-legacy-reset font-bold">Rest</button>
         </div>
      </div>
    </div>

    <!-- TABLE SECTION -->
    <div class="card-panel table-panel">
       <div class="custom-slim-header table-blue-header">
          <span class="custom-header-title">Item Material Type</span>
       </div>
       <div class="panel-table-container">
          <app-product-material-type-table></app-product-material-type-table>
       </div>
    </div>

  </main>
</div>
