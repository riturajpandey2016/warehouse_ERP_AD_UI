<div class="table-card">
  <!-- Table Toolbar -->
  <div class="table-toolbar">
    <div class="toolbar-left">
       <div class="search-box">
          <lucide-icon [img]="SearchIcon" class="absolute left-2 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-slate-400"></lucide-icon>
          <input 
            type="text" 
            placeholder="Search Item Categories..." 
            class="search-input"
          />
       </div>
       <button class="btn-toolbar btn-filter">
          <lucide-icon [img]="FilterIcon" class="w-3 h-3"></lucide-icon> Filter
       </button>
    </div>
    <div class="toolbar-right">
       <button class="btn-toolbar btn-add">
          <lucide-icon [img]="PlusIcon" class="w-3 h-3"></lucide-icon> Add Category
       </button>
       <button class="btn-toolbar btn-filter">
          <lucide-icon [img]="DownloadIcon" class="w-3 h-3"></lucide-icon> Export
       </button>
    </div>
  </div>

  <!-- Table Content -->
  <div class="table-scroll-container">
    <table class="data-table">
      <thead>
        <tr class="table-header-row">
          <th class="px-3 py-2 text-[11px] font-black border-r border-slate-200 w-14 text-center">Serial Number</th>
          <th class="px-3 py-2 text-[11px] font-black border-r border-slate-200">Item Category</th>
          <th class="px-3 py-2 text-[11px] font-black border-r border-slate-200">Description</th>
          <th class="px-3 py-2 text-[11px] font-black border-r border-slate-200">Creation Date</th>
          <th class="px-3 py-2 text-[11px] font-black text-center w-24">Action</th>
        </tr>
        
        <!-- Legacy Header Column Filters matching screenshot exactly -->
        <tr class="bg-slate-50 border-b border-slate-200">
          <td class="p-1 border-r border-slate-100"></td>
          <td class="p-1 border-r border-slate-100">
             <div class="flex items-center gap-1 border border-slate-200 rounded px-1 py-0.5 bg-white">
                <input type="text" class="w-full border-none text-[10px] focus:outline-none focus:ring-0 p-0 font-medium" />
             </div>
          </td>
          <td class="p-1 border-r border-slate-100">
             <div class="flex items-center gap-1 border border-slate-200 rounded px-1 py-0.5 bg-white">
                <input type="text" class="w-full border-none text-[10px] focus:outline-none focus:ring-0 p-0 font-medium" />
             </div>
          </td>
          <td class="p-1 border-r border-slate-100">
             <div class="flex items-center gap-1 border border-slate-200 rounded px-1 py-0.5 bg-white max-w-[120px]">
                <input type="text" class="w-full border-none text-[10px] focus:outline-none focus:ring-0 p-0 font-medium" />
                <span class="text-[10px] cursor-pointer">📅</span>
                <lucide-icon [img]="FilterIcon" class="w-2.5 h-2.5 text-slate-400"></lucide-icon>
             </div>
          </td>
          <td class="p-1"></td>
        </tr>
      </thead>
      <tbody class="table-body">
        @for (item of data(); track item.id; let idx = $index) {
          <tr class="table-body-row">
            <td class="px-3 py-2 text-[11px] font-bold text-slate-400 border-r border-slate-100 text-center">{{ idx + 1 }}</td>
            <td class="px-3 py-2 text-[11px] font-black text-slate-700 border-r border-slate-100 font-mono tracking-tight">{{ item.itemCategory }}</td>
            <td class="px-3 py-2 text-[11px] font-bold text-slate-600 border-r border-slate-100 tracking-tight">{{ item.description }}</td>
            <td class="px-3 py-2 text-[11px] font-medium text-slate-500 border-r border-slate-100">{{ item.creationDate }}</td>
            <td class="cell-actions">
              <div class="action-buttons-group">
                <button class="action-btn">
                  <lucide-icon [img]="EditIcon" class="w-3.5 h-3.5"></lucide-icon>
                </button>
              </div>
            </td>
          </tr>
        } @empty {
          <tr>
            <td colspan="5" class="px-3 py-4 text-center text-[11px] font-bold text-slate-500">No records found.</td>
          </tr>
        }
      </tbody>
    </table>
  </div>

  <!-- Pagination -->
  <div class="table-pagination">
    <div class="pagination-info">
       Showing 1 to {{ data().length }} of {{ data().length }} entries
    </div>
    <div class="pagination-buttons">
       <button class="btn-page btn-page-disabled">Prev</button>
       <button class="btn-page btn-page-active">1</button>
       <button class="btn-page btn-page-disabled">Next</button>
    </div>
  </div>
</div>
