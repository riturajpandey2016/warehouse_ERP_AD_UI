<div class="flex items-center gap-2">
  <label [class]="'text-[11px] font-bold text-slate-600 shrink-0 text-right ' + width">{{ label }}:</label>
  <button 
    type="button"
    (click)="toggle()"
    class="relative w-8 h-4 rounded-full transition-colors flex-shrink-0"
    [class.bg-blue-600]="checked"
    [class.bg-slate-300]="!checked"
  >
    <div 
      class="absolute top-0.5 w-3 h-3 bg-white rounded-full transition-all shadow-sm"
      [style.left]="checked ? '17px' : '2px'"
    ></div>
  </button>
</div>
