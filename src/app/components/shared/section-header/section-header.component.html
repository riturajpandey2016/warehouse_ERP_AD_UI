<div 
  (click)="onToggle()"
  class="px-3 py-1.5 cursor-pointer flex items-center justify-between transition-colors border-b border-slate-300"
  [class.bg-blue-800]="blue"
  [class.text-white]="blue"
  [class.bg-slate-200]="!blue"
  [class.text-slate-700]="!blue"
>
  <h2 class="text-[11px] font-black uppercase tracking-wider">{{ title }}</h2>
  @if (expanded) {
    <lucide-icon [img]="ChevronUpIcon" class="w-3.5 h-3.5"></lucide-icon>
  } @else {
    <lucide-icon [img]="ChevronDownIcon" class="w-3.5 h-3.5"></lucide-icon>
  }
</div>
