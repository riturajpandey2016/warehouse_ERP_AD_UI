<div class="flex items-start gap-2">
  <label [class]="'text-[11px] font-bold text-slate-600 shrink-0 text-right mt-1.5 ' + width">
    {{ label }}@if(required) { <span class="text-red-500 ml-0.5">*</span> }:
  </label>
  <textarea 
    [rows]="rows"
    [value]="value"
    (input)="onTextareaChange($event)"
    class="w-full px-2 py-1 text-[11px] border border-slate-300 rounded focus:border-blue-500 focus:outline-none transition-colors shadow-sm resize-none"
  ></textarea>
</div>
