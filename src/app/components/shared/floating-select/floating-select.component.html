<div class="relative w-full">
  <select
    [id]="id"
    [value]="value"
    (change)="onSelectChange($event)"
    class="block px-3 pb-2.5 pt-4 w-full text-sm text-gray-900 bg-white rounded-md border border-gray-300 appearance-none focus:outline-none focus:ring-1 focus:ring-blue-600 focus:border-blue-600 peer shadow-sm transition-colors"
  >
    <option value="" disabled hidden></option>
    @for (opt of options; track opt.value) {
      <option [value]="opt.value">{{ opt.label }}</option>
    }
  </select>
  <label
    [for]="id"
    class="absolute text-sm duration-300 transform -translate-y-4 scale-75 top-2 z-10 origin-[0] bg-white px-1 start-2.5 peer-focus:text-blue-600 peer-focus:scale-75 peer-focus:-translate-y-4"
    [class.text-gray-500]="true"
    [class.scale-75]="value"
    [class.-translate-y-4]="value"
    [class.scale-100]="!value"
    [class.translate-y-2_5]="!value"
  >
    {{ label }} @if(required) { <span class="text-red-500">*</span> }
  </label>
</div>
