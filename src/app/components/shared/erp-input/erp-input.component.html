<div class="flex items-center gap-2">
  <label [class]="'text-[11px] font-bold text-slate-600 shrink-0 text-right ' + width">
    {{ label }}@if(required) { <span class="text-red-500 ml-0.5">*</span> }:
  </label>
  <input 
    [type]="type" 
    [value]="value"
    (input)="onInputChange($event)"
    [placeholder]="placeholder"
    class="h-7 w-full px-2 text-[11px] border border-slate-300 rounded focus:border-blue-500 focus:outline-none transition-colors shadow-sm"
  />
</div>
