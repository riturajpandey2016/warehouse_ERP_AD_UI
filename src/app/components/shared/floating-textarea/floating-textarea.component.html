<div class="relative w-full">
  <textarea
    [id]="id"
    [value]="value"
    (input)="onTextareaChange($event)"
    [rows]="rows"
    class="block px-3 pb-2.5 pt-4 w-full text-sm text-gray-900 bg-white rounded-md border border-gray-300 appearance-none focus:outline-none focus:ring-1 focus:ring-blue-600 focus:border-blue-600 peer shadow-sm transition-colors resize-none"
    placeholder=" "
  ></textarea>
  <label
    [for]="id"
    class="absolute text-sm text-gray-500 duration-300 transform -translate-y-4 scale-75 top-2 z-10 origin-[0] bg-white px-1 start-2.5 peer-focus:text-blue-600 peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-2.5 peer-focus:scale-75 peer-focus:-translate-y-4 cursor-text"
  >
    {{ label }} @if(required) { <span class="text-red-500">*</span> }
  </label>
</div>
