<div class="company-master-container">
  <!-- Page Title & Header Actions Strip -->
  <header class="page-header">
    <h1 class="text-sm font-black text-blue-900 uppercase tracking-tight flex items-center gap-2">
      <lucide-icon [img]="BookOpenIcon" class="w-4 h-4"></lucide-icon>
      HSN Master
    </h1>
    <div class="header-actions">
       <button class="btn-save">
          <lucide-icon [img]="SaveIcon" class="w-3.5 h-3.5"></lucide-icon> Save
       </button>
       <button (click)="handleReset()" class="btn-reset">
          <lucide-icon [img]="RotateCcwIcon" class="w-3.5 h-3.5"></lucide-icon> Reset
       </button>
    </div>
  </header>

  <main class="page-content">
    
    <!-- DETAILS SECTION -->
    <div class="card-panel">
      <app-section-header title="HSN / SAC Details" [expanded]="sections().details" (toggle)="toggleSection('details')"></app-section-header>
      @if (sections().details) {
        <div class="panel-body">
           <div class="hsn-form-grid">
              
              <!-- Left Column of Controls -->
              <div class="left-form-controls">
                 <div class="form-row-side">
                    <div class="form-label-box">
                       <span class="form-label-text">HSN / SAC Code <span class="required-asterisk">*</span>:</span>
                    </div>
                    <div class="form-input-element">
                       <app-erp-input 
                         [value]="formData().hsnCode" 
                         (valueChange)="updateForm('hsnCode', $event)"
                         placeholder="HSN / SAC Code">
                       </app-erp-input>
                    </div>
                 </div>

                 <div class="form-row-side">
                    <div class="form-label-box">
                       <span class="form-label-text">Tax Percentage Type <span class="required-asterisk">*</span>:</span>
                    </div>
                    <div class="form-input-element">
                       <app-erp-select 
                         [value]="formData().taxPercentageType" 
                         (valueChange)="updateForm('taxPercentageType', $event)"
                         [options]="taxTypeOptions"
                         placeholder="Select Tax Type">
                       </app-erp-select>
                    </div>
                 </div>

                 <div class="form-row-side">
                    <div class="form-label-box">
                       <span class="form-label-text">Type <span class="required-asterisk">*</span>:</span>
                    </div>
                    <div class="form-input-element">
                       <app-erp-select 
                         [value]="formData().type" 
                         (valueChange)="updateForm('type', $event)"
                         [options]="typeOptions"
                         placeholder="Select">
                       </app-erp-select>
                    </div>
                 </div>
              </div>

              <!-- Right Column of Controls -->
              <div class="right-form-controls">
                 <div class="form-row-side flex-start-align">
                    <div class="form-label-box">
                       <span class="form-label-text">Description <span class="required-asterisk">*</span>:</span>
                    </div>
                    <div class="form-input-element">
                       <app-erp-textarea 
                         [rows]="2"
                         [value]="formData().description" 
                         (valueChange)="updateForm('description', $event)"
                         placeholder="Description">
                       </app-erp-textarea>
                    </div>
                 </div>

                 <div class="form-row-side">
                    <div class="form-label-box">
                       <span class="form-label-text">Tax Percentage <span class="required-asterisk">*</span>:</span>
                    </div>
                    <div class="form-input-element">
                       <app-erp-input 
                         [value]="formData().taxPercentage" 
                         (valueChange)="updateForm('taxPercentage', $event)"
                         placeholder="Tax Percentage">
                       </app-erp-input>
                    </div>
                 </div>
              </div>

           </div>
        </div>
      }
    </div>

    <!-- TABLE SECTION -->
    <div class="card-panel table-panel">
       <app-section-header title="HSN / SAC Details Registry" [expanded]="sections().table" (toggle)="toggleSection('table')" [blue]="true"></app-section-header>
       @if (sections().table) {
          <div class="panel-table-container">
             <app-hsn-table></app-hsn-table>
          </div>
       }
    </div>

  </main>
</div>
