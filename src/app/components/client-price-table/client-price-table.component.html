<div class="table-card">
  <div class="table-scroll-container">
    <table class="data-table">
      <thead>
        <tr class="table-header-row">
          <th class="text-center w-24">Serial Number</th>
          <th class="w-[180px]">Item Code</th>
          <th>Item Name</th>
          <th class="w-[180px]">Rate</th>
          <th class="text-center w-[120px]">Edit</th>
        </tr>
        
        <tr class="bg-slate-50 border-b border-slate-200">
          <td class="p-1 border-r border-slate-100"></td>
          <td class="p-1 border-r border-slate-100">
             <div class="flex items-center gap-1">
                <input type="text" class="custom-legacy-input" />
                <button class="filter-btn">
                   <lucide-icon [img]="FilterIcon" class="w-3 h-3 text-slate-500"></lucide-icon>
                </button>
             </div>
          </td>
          <td class="p-1 border-r border-slate-100">
             <div class="flex items-center gap-1">
                <input type="text" class="custom-legacy-input" />
                <button class="filter-btn">
                   <lucide-icon [img]="FilterIcon" class="w-3 h-3 text-slate-500"></lucide-icon>
                </button>
             </div>
          </td>
          <td class="p-1 border-r border-slate-100">
             <div class="flex items-center gap-1">
                <input type="text" class="custom-legacy-input" />
                <button class="filter-btn">
                   <lucide-icon [img]="FilterIcon" class="w-3 h-3 text-slate-500"></lucide-icon>
                </button>
             </div>
          </td>
          <td class="p-1"></td>
        </tr>
      </thead>
      <tbody class="table-body">
        @for (item of data(); track item.id; let idx = $index) {
          <tr class="table-body-row">
            <td class="px-3 py-2 text-[11px] font-bold text-slate-400 border-r border-slate-100 text-center">{{ idx + 1 }}</td>
            <td class="px-3 py-2 text-[11px] font-semibold text-slate-600 border-r border-slate-100">{{ item.itemCode }}</td>
            <td class="px-3 py-2 text-[11px] font-black text-slate-700 border-r border-slate-100 tracking-tight">{{ item.itemName }}</td>
            <td class="px-3 py-2 text-[11px] font-bold text-slate-700 border-r border-slate-100 text-right">{{ item.rate }}</td>
            <td class="px-3 py-2 text-[11px] text-center">
               <button (click)="editItem.emit(item)" class="edit-btn font-bold">Edit</button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>

  <!-- EXACT PAGINATION TO MATCH THE SCREENSHOT -->
  <div class="table-pagination">
    <div class="pagination-controls-box">
       <div class="pagination-buttons">
          <button class="btn-page">K</button>
          <button class="btn-page">&lt;</button>
          <button class="btn-page btn-page-active">1</button>
          <button class="btn-page">2</button>
          <button class="btn-page">3</button>
          <button class="btn-page">4</button>
          <button class="btn-page">5</button>
          <button class="btn-page">6</button>
          <button class="btn-page">7</button>
          <button class="btn-page">8</button>
          <button class="btn-page">9</button>
          <button class="btn-page">10</button>
          <button class="btn-page btn-page-disabled">..</button>
          <button class="btn-page">&gt;</button>
          <button class="btn-page">&gt;|</button>
       </div>
       <div class="pagination-info flex items-center gap-1">
          <span>Page size:</span>
          <select class="height-[20px] text-[11px] font-bold border border-slate-400 px-1 py-0 rounded">
             <option value="10">10</option>
             <option value="25">25</option>
             <option value="50">50</option>
          </select>
       </div>
    </div>
    
    <div class="pagination-info">
       1152 items in 116 pages
    </div>
  </div>
</div>
